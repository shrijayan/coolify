# documentation: https://rxresu.me/
# slogan: A one-of-a-kind resume builder that keeps your privacy in mind.
# category: productivity
# tags: reactive-resume,resume-builder,open-source,2fa
# logo: svgs/rxresume.svg
# port: 3000

services:
  reactive-resume:
    image: amruthpillai/reactive-resume:v6
    environment:
      - SERVICE_URL_REACTIVERESUME_3000
      - 'APP_URL=$SERVICE_URL_REACTIVERESUME'
      - 'DATABASE_URL=postgresql://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgres:5432/${POSTGRES_DB:-postgres}'
      - 'AUTH_SECRET=${SERVICE_HEX_64_AUTHSECRET}'
    volumes:
      - reactive-resume-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "require('http').get('http://127.0.0.1:3000/api/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:18
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=$SERVICE_USER_POSTGRES
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  reactive-resume-data:
  postgres-data:
